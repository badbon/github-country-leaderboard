name: Collect leaderboards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Maximum GitHub API requests for this run"
        required: false
        default: "1200"
      chunk_queries:
        description: "Requests per committed chunk"
        required: false
        default: "75"

permissions:
  contents: write

concurrency:
  group: collect-leaderboards
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm test

      - name: Collect and commit chunks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_QUERIES: ${{ inputs.max_queries || '1200' }}
          CHUNK_QUERIES: ${{ inputs.chunk_queries || '75' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remaining="$MAX_QUERIES"
          chunk_index=1
          while [ "$remaining" -gt 0 ]; do
            current="$CHUNK_QUERIES"
            if [ "$remaining" -lt "$current" ]; then
              current="$remaining"
            fi

            echo "Collecting chunk ${chunk_index} with ${current} requests remaining budget ${remaining}"
            npm run collect -- --max-queries "$current"

            if [ -n "$(git status --porcelain cache data/state.json markdown)" ]; then
              git add cache data/state.json markdown
              git commit -m "Update GitHub country leaderboards"
              git pull --rebase
              git push
            else
              echo "No generated changes for chunk ${chunk_index}"
            fi

            remaining=$((remaining - current))
            chunk_index=$((chunk_index + 1))
          done
